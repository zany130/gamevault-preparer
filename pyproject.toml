[project]
name = "gamevault-preparer"
version = "1.0.1"
description = "Install a Windows game with Wine and pack the game folder as a GameVault ZIP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5",
    "libarchive-c>=5.1",
]

[project.scripts]
gamevault-preparer = "app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "window", "workers", "wine", "files", "fixes", "packaging", "notes"]
